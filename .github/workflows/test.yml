name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node scripts/apply-strategy-costs.js
      - name: data.json stays valid JSON after apply
        run: node -e "JSON.parse(require('fs').readFileSync('data.json','utf8'))"
      - name: apply keeps cost-inputs and reattaches broker/strategy/coverage
        run: |
          test -f cost-inputs.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("data.json","utf8"));
            const r = d.equities.find((e) => e.ticker === "RKLB").costs;
            if (!d.equities.every((e) => e.costs && e.costs.brokerCostPerShare != null)) process.exit(1);
            if (r.strategyApproximatePerShare !== 35.6) process.exit(2);
            if (r.coverage.queriedHistoryTo !== "2026-11-09") process.exit(3);
            if (r.coverage.sinceInceptionVerified === true) process.exit(4);
          '
