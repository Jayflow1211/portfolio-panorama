name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - run: node scripts/apply-strategy-costs.js
      - name: data.json stays valid JSON after apply
        run: node -e "JSON.parse(require('fs').readFileSync('data.json','utf8'))"
